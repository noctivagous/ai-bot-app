<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Muse — fixture (NOT muse.ai)</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #101216; color: #e8eaed; }
  .fixture-banner { background: #5b4300; color: #ffd75e; font: 12px ui-monospace, monospace; padding: 4px 10px; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid #262a31; }
  header .logo { font-weight: 700; letter-spacing: .04em; }
  header .spacer { flex: 1; }
  button { background: #2a2f37; color: #e8eaed; border: 1px solid #3a4048; border-radius: 6px; padding: 5px 11px; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: #ffb224; color: #17130a; border-color: #ffb224; font-weight: 600; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  [data-testid="message-list"] { display: flex; flex-direction: column; gap: 10px; min-height: 200px; }
  .msg { padding: 9px 12px; border-radius: 8px; line-height: 1.5; white-space: pre-wrap; }
  .msg[data-role="user"] { background: #23324a; align-self: flex-end; max-width: 85%; }
  .msg[data-role="bot"] { background: #1c1f24; border: 1px solid #262a31; }
  [data-testid="working-indicator"] { color: #ffb224; font: 12px ui-monospace, monospace; padding: 6px 2px; }
  .composer-row { display: flex; gap: 8px; margin-top: 14px; }
  textarea[data-testid="composer"] { flex: 1; background: #17191d; color: #e8eaed; border: 1px solid #333842; border-radius: 8px; padding: 9px; min-height: 56px; font: inherit; }
  [data-testid="activity-panel"] { border-bottom: 1px solid #262a31; background: #14161a; padding: 10px 14px; }
  [data-testid="activity-panel"] h3 { margin: 8px 0 6px; font-size: 11px; letter-spacing: .12em; color: #9aa3ad; text-transform: uppercase; }
  .activity-entry { border: 1px solid #262a31; border-radius: 8px; margin-bottom: 6px; background: #1a1d22; }
  .activity-head { display: flex; justify-content: space-between; gap: 10px; width: 100%; text-align: left; background: none; border: none; padding: 8px 10px; }
  .activity-detail, .activity-outcome { padding: 0 10px 9px; color: #b9c0c8; font-size: 13px; line-height: 1.5; }
  .activity-outcome { color: #8fd48a; }
  [data-testid="approval-card"] { border: 1px solid #ffb224; border-radius: 10px; padding: 12px; margin-top: 14px; background: #221d10; }
  [data-testid="approval-card"] .btns { display: flex; gap: 8px; margin-top: 9px; }
  .landing { text-align: center; padding: 80px 20px; }
</style>
</head>
<body>
<div class="fixture-banner">TEST FIXTURE — a local page mimicking muse.ai chat semantics. Not muse.ai.</div>
<div data-testid="app-root" id="app"></div>

<script>
(() => {
  const params = new URLSearchParams(location.search);
  const signedOut = params.has('signedout');
  const noSend = params.has('nosend');
  const app = document.querySelector('[data-testid="app-root"]');

  if (signedOut) {
    app.innerHTML = `
      <header><span class="logo">Muse</span></header>
      <div class="landing">
        <h1>Welcome to Muse</h1>
        <p>Your personal agent.</p>
        <button class="primary" data-testid="sign-in-button">Sign in</button>
      </div>`;
    return;
  }

  app.innerHTML = `
    <header>
      <span class="logo">Muse</span>
      <div data-testid="signed-in-marker">Signed in as <b data-testid="agent-name">Kavi</b></div>
      <span class="spacer"></span>
      <button data-testid="trigger-approval" title="Fixture test control">Trigger approval</button>
      <button data-testid="activity-button" aria-label="Activity" aria-expanded="false">Activity</button>
    </header>
    <section data-testid="activity-panel" hidden>
      <h3>Active</h3>
      <div data-testid="activity-active"></div>
      <h3>Past</h3>
      <div data-testid="activity-past"></div>
    </section>
    <main>
      <div data-testid="message-list" role="log" aria-label="Messages"></div>
      <div data-testid="working-indicator" hidden>Kavi is working…</div>
      <div data-testid="approval-region"></div>
      <div class="composer-row">
        <textarea data-testid="composer" placeholder="Message Muse…"></textarea>
        ${noSend ? '<!-- ?nosend variant: the send control is absent -->' : '<button class="primary" data-testid="send-button">Send</button>'}
      </div>
    </main>`;

  const list = app.querySelector('[data-testid="message-list"]');
  const composer = app.querySelector('[data-testid="composer"]');
  const sendBtn = app.querySelector('[data-testid="send-button"]');
  const working = app.querySelector('[data-testid="working-indicator"]');
  const approvalRegion = app.querySelector('[data-testid="approval-region"]');
  const panel = app.querySelector('[data-testid="activity-panel"]');
  const activeBox = app.querySelector('[data-testid="activity-active"]');
  const pastBox = app.querySelector('[data-testid="activity-past"]');
  const activityBtn = app.querySelector('[data-testid="activity-button"]');

  activityBtn.addEventListener('click', () => {
    panel.hidden = !panel.hidden;
    activityBtn.setAttribute('aria-expanded', String(!panel.hidden));
  });

  // ---- message list ----

  let msgCounter = 0;
  function addMessage(role, text, id) {
    const el = document.createElement('div');
    el.className = 'msg';
    el.dataset.role = role;
    el.dataset.msgId = id ?? `fx-${role}-${++msgCounter}`;
    el.dataset.ts = new Date().toISOString();
    el.textContent = text;
    list.appendChild(el);
    return el;
  }
  addMessage('user', 'Morning — please keep an eye on the transcript batch and the layout walk.', 'fx-user-1');
  addMessage('bot', 'Will do. Both are running as activities; you can watch them from the Activity panel.', 'fx-bot-1');
  msgCounter = 1;

  // ---- framework-controlled composer ----
  // Emulates a React-style controlled field honestly: the component keeps
  // its own state, and the DOM node's value SETTER is the component's
  // tracker (as React installs one). Assigning el.value directly updates
  // the tracker, so a later 'input' event sees no change and the component
  // state does NOT move; only writing through the NATIVE prototype setter
  // (which bypasses the tracker) + dispatching 'input' registers as an
  // edit. The Send handler reads component state, never the DOM value —
  // so a send that bypasses the framework path sends nothing.

  const protoDesc = Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype, 'value');
  let trackerValue = '';
  Object.defineProperty(composer, 'value', {
    configurable: true,
    get() { return protoDesc.get.call(this); },
    set(v) { trackerValue = String(v); protoDesc.set.call(this, v); },
  });
  const composerState = { value: '' };
  composer.addEventListener('input', () => {
    if (composer.value !== trackerValue) {
      composerState.value = composer.value;
      trackerValue = composer.value;
    }
  });
  function clearComposer() {
    composerState.value = '';
    composer.value = ''; // via the tracked setter — state and DOM agree
  }

  // ---- activity panel model ----

  const activities = new Map();
  function renderActivity(a) {
    let el = a.el;
    if (!el) {
      el = document.createElement('div');
      el.className = 'activity-entry';
      el.dataset.testid = 'activity-entry';
      el.dataset.activityId = a.id;
      el.dataset.conversationRef = 'chat-main';
      el.innerHTML = `
        <button class="activity-head">
          <span class="a-title"></span>
          <span class="a-status"></span>
        </button>
        <div class="activity-detail" data-testid="activity-detail" hidden></div>
        <div class="activity-outcome" data-testid="activity-outcome" hidden></div>`;
      el.querySelector('.activity-head').addEventListener('click', () => {
        const d = el.querySelector('.activity-detail');
        d.hidden = !d.hidden;
      });
      a.el = el;
    }
    el.dataset.state = a.state;
    el.querySelector('.a-title').textContent = a.title;
    el.querySelector('.a-status').textContent =
      a.state === 'active' ? `Active · ${fmtElapsed(a.elapsedSec)}` : a.state === 'failed' ? 'Failed' : 'Done';
    el.querySelector('.activity-detail').textContent = a.detail;
    const out = el.querySelector('.activity-outcome');
    if (a.outcome && a.state !== 'active') {
      // An outcome exists only once the activity has finished — a real
      // Activity view never shows one for work still running.
      out.hidden = false;
      out.textContent = a.outcome;
    }
    (a.state === 'active' ? activeBox : pastBox).appendChild(el);
  }
  function fmtElapsed(s) {
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  }
  function addActivity(a) {
    activities.set(a.id, a);
    renderActivity(a);
    return a;
  }

  const review = addActivity({
    id: 'act-review', title: 'Reviewing CSKG transcript batch', state: 'active', elapsedSec: 0,
    detail: 'Reading transcript batch 4, turn by turn.',
    detailSteps: [
      'Reading transcript batch 4, turn by turn.',
      'Checking each grounded claim against CSKG testimony.',
      'Flagging sense-selection misses for the engine notes.',
      'Composing the review summary.',
    ],
    stepIdx: 0,
    finishAtSec: 35,
    outcome: 'Review ready — Chicago set: 26 grounded / 0 ungrounded / 2 declined.',
  });
  addActivity({
    id: 'act-layout', title: 'Verifying layout-fix walk', state: 'active', elapsedSec: 0,
    detail: 'Walking tutorial step 12 of 143 — panel sections opening on cue.',
    detailSteps: [
      'Walking tutorial step 12 of 143 — panel sections opening on cue.',
      'Checking that off-screen targets scroll into view.',
      'Verifying bubble clamping at phone and desktop widths.',
    ],
    stepIdx: 0,
    finishAtSec: Infinity,
  });
  addActivity({
    id: 'act-briefing', title: 'Morning briefing compiled', state: 'done', elapsedSec: 0,
    detail: 'Compiled the morning briefing from schedule, goals and mail.',
    outcome: 'Delivered at 08:00.',
  });

  setInterval(() => {
    for (const a of activities.values()) {
      if (a.state !== 'active' || !a.detailSteps) continue;
      a.elapsedSec += 1;
      if (a.elapsedSec % 6 === 0 && a.stepIdx < a.detailSteps.length - 1) {
        a.stepIdx += 1;
        a.detail = a.detailSteps[a.stepIdx];
      }
      if (a.elapsedSec >= a.finishAtSec) {
        a.state = 'done';
        a.detail = a.detailSteps[a.detailSteps.length - 1];
      }
      renderActivity(a);
    }
  }, 1000);

  // ---- approval card ----

  let approvalCounter = 0;
  let pendingCard = null;
  function showApproval() {
    if (pendingCard) return pendingCard;
    const id = `appr-${++approvalCounter}`;
    const card = document.createElement('div');
    card.dataset.testid = 'approval-card';
    card.dataset.approvalId = id;
    card.dataset.scopes = 'once,always';
    card.innerHTML = `
      <div data-testid="approval-title">Allow Kavi to push branch fix/object-menu-and-boxes to main?</div>
      <div style="color:#b9c0c8; font-size:13px; margin-top:4px">
        Muse asks before it pushes — allow once, always allow, or deny.
      </div>
      <div class="btns">
        <button class="primary" data-testid="approval-allow-once">Allow once</button>
        <button data-testid="approval-always">Always allow</button>
        <button data-testid="approval-deny">Deny</button>
      </div>
      <div data-testid="approval-outcome" hidden style="margin-top:8px; color:#8fd48a"></div>`;
    const resolve = (value, label) => {
      card.dataset.resolved = value;
      const out = card.querySelector('[data-testid="approval-outcome"]');
      out.hidden = false;
      out.textContent = label;
      card.querySelectorAll('button').forEach((b) => { b.disabled = true; });
      pendingCard = null;
    };
    card.querySelector('[data-testid="approval-allow-once"]').addEventListener('click', () => resolve('allow-once', 'Allowed — once'));
    card.querySelector('[data-testid="approval-always"]').addEventListener('click', () => resolve('allow-always', 'Allowed — always'));
    card.querySelector('[data-testid="approval-deny"]').addEventListener('click', () => resolve('deny', 'Denied'));
    approvalRegion.appendChild(card);
    pendingCard = card;
    return card;
  }
  app.querySelector('[data-testid="trigger-approval"]').addEventListener('click', showApproval);

  // ---- send + streaming bot ----

  let turnCounter = 0;
  function botReplyFor(userText) {
    if (/propose a session/i.test(userText)) {
      return [
        'Here is a proposed session, plus the map artifact it belongs with.',
        '',
        '```intent',
        '{"type":"schedule","title":"Fixture planning session","day":2,"project":"Chinese Book"}',
        '```',
        '',
        '```intent',
        '{"type":"webview","title":"Chinese map + timeline outline","ref":"art-chinese-map"}',
        '```',
      ].join('\n');
    }
    return `Fixture reply — I received “${userText}”. This reply streams from the fixture page, token by token, like the real client.`;
  }

  function sendCurrent() {
    const text = composerState.value.trim();
    if (!text) return; // state-driven: a DOM-only value never reaches here
    clearComposer();
    addMessage('user', text);
    const turn = ++turnCounter;
    const botEl = addMessage('bot', '');
    const reply = botReplyFor(text);
    working.hidden = false;
    const turnActivity = addActivity({
      id: `act-turn-${turn}`, title: 'Replying in this chat', state: 'active', elapsedSec: 0,
      detail: 'Streaming a reply in the open conversation.',
    });
    let i = 0;
    const step = Math.max(4, Math.round(reply.length / 18));
    const timer = setInterval(() => {
      i = Math.min(reply.length, i + step);
      botEl.textContent = reply.slice(0, i);
      botEl.dataset.ts = new Date().toISOString();
      if (i >= reply.length) {
        clearInterval(timer);
        working.hidden = true;
        turnActivity.state = 'done';
        turnActivity.outcome = 'Reply sent.';
        renderActivity(turnActivity);
        if (/deploy|push/i.test(text)) showApproval();
      }
    }, 110);
  }
  if (sendBtn) sendBtn.addEventListener('click', sendCurrent);
  composer.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendCurrent();
    }
  });
})();
</script>
</body>
</html>
