<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission Desk — Setup Wizard</title>
<style>
  :root{
    --bg:#131416; --bg2:#17181b; --panel:#1e2023; --panel2:#232529;
    --edge:#2e3036; --edge-lit:#3a3d44;
    --text:#e8e9ea; --dim:#a7abb3; --faint:#7c8087;
    --amber:#f0b23e; --amber-dim:#8a6a24; --green:#7fc96a; --red:#e06c5a;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:linear-gradient(180deg,var(--bg2),var(--bg) 240px);color:var(--text);
       font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
       height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
  a{color:var(--amber);text-decoration:none}
  a:hover{text-decoration:underline}
  code{font-family:var(--mono);font-size:.86em;background:#101112;border:1px solid var(--edge);
       border-radius:4px;padding:.08em .38em;color:#f3d9a4}
  .wrap{max-width:1060px;width:100%;margin:0 auto;padding:0 20px 16px;flex:1;min-height:0;
        display:flex;flex-direction:column;position:relative}

  /* ---------- wizard header (persistent) ---------- */
  header{padding:20px 0 0;flex:none}
  .kicker{font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--amber);
          text-transform:uppercase;margin:0 0 8px}
  .headrow{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
  h1{font-size:26px;line-height:1.15;margin:0;font-weight:650;letter-spacing:-.01em}
  h1 .thin{color:var(--dim);font-weight:400}
  .headbtns{margin-left:auto;display:flex;gap:8px}
  .btn{appearance:none;cursor:pointer;font:inherit;font-size:13px;font-weight:550;color:var(--dim);
       background:linear-gradient(180deg,#2b2d33,#22242a);border:1px solid var(--edge-lit);
       border-radius:7px;padding:7px 13px;max-height:40px;
       box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 1px 2px rgba(0,0,0,.5)}
  .btn:hover{color:var(--text)}
  .btn:disabled{opacity:.38;cursor:default}
  .btn:disabled:hover{color:var(--dim)}
  .crumbs{flex:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0 12px;
      padding:8px 12px;background:linear-gradient(180deg,#26282d,#1d1f23);border:1px solid var(--edge);
      border-radius:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 4px 14px rgba(0,0,0,.45);
      font-family:var(--mono);font-size:12px;color:var(--faint)}
  .crumbs .sep{color:var(--amber-dim)}
  .crumbs .here{color:var(--amber)}

  /* ---------- scrolling node region + drawn scrollbar ---------- */
  .scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
      padding:2px 14px 26px 2px;scrollbar-width:none}
  .scroll::-webkit-scrollbar{display:none;width:0;height:0}
  .scroll:focus{outline:none}
  #vbar{position:absolute;right:5px;width:12px;border-radius:7px;z-index:30;display:none;
      background:rgba(255,255,255,.04);box-shadow:inset 0 1px 4px rgba(0,0,0,.55);cursor:pointer}
  #vbar.show{display:block}
  #vthumb{position:absolute;left:1px;width:10px;border-radius:6px;cursor:grab;
      background:linear-gradient(180deg,#454954,#2f3239);border:1px solid #4d515c;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 1px 3px rgba(0,0,0,.5)}
  #vthumb:hover{background:linear-gradient(180deg,#515663,#383b43)}
  #vbar.dragging #vthumb,#vthumb:active{cursor:grabbing;
      background:linear-gradient(180deg,#ffc95e,var(--amber));border-color:var(--amber-dim)}

  /* ---------- node panel & type ---------- */
  .panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--edge);
      border-radius:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 3px 10px rgba(0,0,0,.4);
      padding:22px 24px;margin:0 0 18px;animation:fade .18s ease}
  @keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
  .nkicker{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--faint);
      text-transform:uppercase;margin:0 0 8px}
  h2{font-size:21px;margin:2px 0 12px;font-weight:640;letter-spacing:-.01em}
  h3{font-size:15.5px;margin:20px 0 8px;font-weight:620}
  h3:first-child{margin-top:0}
  p{margin:0 0 12px;color:#d6d8db}
  p.dim,li.dim{color:var(--dim)}
  ul,ol{margin:0 0 12px;padding-left:22px;color:#d6d8db}
  li{margin:4px 0}
  .warn{border-left:3px solid var(--red);background:#1d1a1a;border-radius:0 9px 9px 0;padding:12px 16px;margin:0 0 14px}
  .warn p{margin:0;font-size:13.5px;color:#e3cfcb}
  .note{border-left:3px solid var(--amber);background:#1d1b16;border-radius:0 9px 9px 0;padding:12px 16px;margin:0 0 14px}
  .note p{margin:0;font-size:13.5px;color:#e6dcc4}
  .donebox{border-left:3px solid var(--green);background:#181d16;border-radius:0 9px 9px 0;padding:12px 16px;margin:0 0 14px}
  .donebox p{margin:0;font-size:13.5px;color:#d8e6cf}

  /* command blocks */
  .term{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--amber);
      text-transform:uppercase;margin:14px 0 6px}
  .term:first-child{margin-top:0}
  .cmd{position:relative;background:#0e0f10;border:1px solid var(--edge);border-radius:9px;
       box-shadow:inset 0 2px 10px rgba(0,0,0,.7);padding:13px 64px 13px 16px;margin:0 0 14px;overflow-x:auto}
  .cmd::-webkit-scrollbar{height:10px}
  .cmd::-webkit-scrollbar-thumb{background:#33363d;border-radius:6px;border:2px solid #0e0f10}
  .cmd::-webkit-scrollbar-track{background:rgba(255,255,255,.03)}
  .cmd pre{margin:0;font-family:var(--mono);font-size:13px;line-height:1.6;color:#f0e3c0;white-space:pre}
  .cmd button{position:absolute;top:8px;right:8px;appearance:none;cursor:pointer;
      background:linear-gradient(180deg,#2e3036,#232529);color:var(--dim);border:1px solid var(--edge-lit);
      border-radius:6px;font-family:var(--mono);font-size:11px;padding:4px 9px;max-height:32px}
  .cmd button:hover{color:var(--text)}
  .cmd button.ok{color:var(--green);border-color:#3f5a34}

  /* choices + actions */
  .choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin:16px 0 4px}
  .choice{appearance:none;cursor:pointer;text-align:left;font:inherit;font-size:14.5px;font-weight:580;
      color:var(--text);background:linear-gradient(180deg,#2b2d33,#22242a);border:1px solid var(--edge-lit);
      border-radius:9px;padding:11px 15px;min-height:44px;max-height:50px;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 1px 2px rgba(0,0,0,.5)}
  .choice:hover{border-color:var(--amber-dim);color:#fff}
  .choice small{display:block;font-weight:400;font-size:12.5px;color:var(--dim);margin-top:2px}
  .actions{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 2px}
  .go{appearance:none;cursor:pointer;font:inherit;font-size:14px;font-weight:620;color:#171408;
      background:linear-gradient(180deg,#ffc95e,var(--amber));border:1px solid var(--amber-dim);
      border-radius:8px;padding:10px 18px;min-height:44px;max-height:50px;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 1px 3px rgba(0,0,0,.5)}
  .go:hover{filter:brightness(1.05)}
  .go.alt{color:var(--dim);background:linear-gradient(180deg,#2b2d33,#22242a);border-color:var(--edge-lit);
      font-weight:550;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 1px 2px rgba(0,0,0,.5)}
  .go.alt:hover{color:var(--text)}

  /* ticks */
  .ticks{margin:14px 0 2px;border-top:1px solid var(--edge);padding-top:12px}
  label.tick{display:flex;gap:9px;align-items:flex-start;cursor:pointer;color:var(--dim);font-size:13.5px;margin-top:6px}
  label.tick input{margin-top:3px;accent-color:var(--amber)}

  footer{color:var(--faint);font-size:12.5px;flex:none;margin-top:12px;border-top:1px solid var(--edge);padding-top:12px}
  footer code{font-size:11px}
  @media (max-width:640px){ h1{font-size:23px} .headbtns{margin-left:0} }
</style>
</head>
<body>
<div class="wrap">

<header>
  <p class="kicker">ai-bot-app · Setup wizard</p>
  <div class="headrow">
    <h1>Mission Desk <span class="thin">— set it up, step by step</span></h1>
    <div class="headbtns">
      <button class="btn" id="backBtn" type="button">← Back</button>
      <button class="btn" id="startOverBtn" type="button">Start over</button>
    </div>
  </div>
  <div class="crumbs" id="crumbs" aria-label="Path so far"></div>
</header>

<main class="scroll" id="scroll" tabindex="0">
  <div id="nodeHost"></div>
</main>

<div id="vbar" aria-hidden="true"><div id="vthumb"></div></div>

<footer>
  Mission Desk for Muse · ai-bot-app · This wizard is a single self-contained file — it works
  opened straight from disk, no server, no network, and it runs nothing: every command is yours to copy and run.
</footer>
</div>

<script>
(function(){
  "use strict";

  /* ================= helpers ================= */
  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  // A command well. `term` names the terminal the command belongs to.
  function CMD(text, term){
    return (term ? '<div class="term">' + esc(term) + "</div>" : "") +
      '<div class="cmd"><pre>' + esc(text) + '</pre><button type="button" data-copy>copy</button></div>';
  }
  function TICKS(list){
    if(!list || !list.length) return "";
    return '<div class="ticks">' + list.map(function(t){
      return '<label class="tick"><input type="checkbox" data-tick="' + t[0] + '"> ' + t[1] + "</label>";
    }).join("") + "</div>";
  }
  function osName(os){ return os === "win" ? "Windows" : os === "mac" ? "macOS" : ""; }
  // Per-OS pairing-file path shape (the repo folder, wherever it was put).
  function pairPath(os){
    return os === "win" ? "C:\\Users\\you\\ai-bot-app\\bridge\\.pairing.json"
                        : "~/ai-bot-app/bridge/.pairing.json";
  }
  function extPath(os){
    return os === "win" ? "C:\\Users\\you\\ai-bot-app\\extension"
                        : "~/ai-bot-app/extension";
  }

  /* ================= the tree =================
     Each node: crumb (array; "{OS}" is replaced by the chosen OS),
     view(S) -> { kicker, title, body (HTML), ticks, actions }.
     Each action: { label, sub?, to, os?, kind: "choice" | "go" | "alt" }. */
  var NODES = {

  /* ---------- ROOT ---------- */
  root: {
    crumb: ["Start"],
    view: function(){
      return {
        kicker: "Mission Desk setup wizard",
        title: "What are you doing?",
        body:
          "<p>This wizard walks you through Mission Desk one decision at a time. " +
          "It is a guide, not an installer: <b>this page executes nothing</b>. You read a step, " +
          "copy its command, run it yourself in your own terminal, then click on.</p>" +
          "<p>That is deliberate. Mission Desk has several moving parts — a bridge, an app page, " +
          "a browser extension, and your muse.ai tab — and guided steps are easier to follow than " +
          "a launcher script. Scripts have a second problem: Gatekeeper on macOS and SmartScreen " +
          "on Windows both fight unsigned scripts on first run. An HTML file has nothing to sign " +
          "and nothing to block — you stay in control of every command that runs.</p>" +
          "<p class='dim'>Pick where you are. You can go Back at any point, or Start over.</p>",
        actions: [
          { label: "Install Mission Desk", sub: "First time, on this machine", to: "installOs", kind: "choice" },
          { label: "Start it for the day", sub: "Already installed — just launch it", to: "startHub", kind: "choice" },
          { label: "Update to the latest version", sub: "Pull the new code and restart", to: "updateHub", kind: "choice" },
          { label: "Fix a problem", sub: "Something is red, missing, or stuck", to: "fixHub", kind: "choice" }
        ]
      };
    }
  },

  /* ---------- INSTALL: OS ---------- */
  installOs: {
    crumb: ["Install", "System"],
    view: function(){
      return {
        kicker: "Install",
        title: "Which system are you on?",
        body: "<p>A few steps differ — install commands and file paths. The wizard remembers " +
              "your answer and renders only your system's version from here on.</p>",
        actions: [
          { label: "macOS", to: "installIntro", os: "mac", kind: "choice" },
          { label: "Windows", to: "installIntro", os: "win", kind: "choice" }
        ]
      };
    }
  },

  installIntro: {
    crumb: ["Install", "{OS}", "Overview"],
    view: function(S){
      return {
        kicker: "Install · " + osName(S.os),
        title: "What you'll end up with",
        body:
          "<ul>" +
          "<li><b>The bridge</b> — a small local program on 127.0.0.1:7701 that relays between the app and the extension, and holds the pairing token.</li>" +
          "<li><b>The Mission Desk app page</b> — served from your machine at localhost:4173, open in one browser tab.</li>" +
          "<li><b>The extension + your muse.ai tab</b> — the extension loaded into Chrome, paired with the bridge, riding in the muse.ai tab you open and sign into yourself.</li>" +
          "</ul>" +
          "<h3>What you need</h3>" +
          "<ul>" +
          "<li><b>Chrome</b> (or Chromium), with Developer mode available for extensions.</li>" +
          "<li><b>A terminal</b> — " + (S.os === "win" ? "Windows Terminal or PowerShell" : "Terminal") + ". Two windows of it, by the end.</li>" +
          "<li><b>About 10 minutes</b>, and a muse.ai account you sign into yourself. Nothing in this stack ever sees your password.</li>" +
          "</ul>",
        actions: [ { label: "Continue", to: "nodeCheck", kind: "go" } ]
      };
    }
  },

  /* ---------- INSTALL: Node ---------- */
  nodeCheck: {
    crumb: ["Install", "{OS}", "Node"],
    view: function(){
      return {
        kicker: "Install · Check",
        title: "Is Node 20 or higher installed?",
        body:
          "<p>Mission Desk's bridge and app both run on Node. Open a terminal and run:</p>" +
          CMD("node --version", "Terminal") +
          "<p>It prints something like <code>v20.11.0</code> or <code>v22.x</code>. " +
          "Any version starting with v20 or higher is fine.</p>",
        actions: [
          { label: "I see v20 or higher", to: "getCode", kind: "go" },
          { label: "Command not found, or lower than v20", to: "nodeInstall", kind: "alt" }
        ]
      };
    }
  },

  nodeInstall: {
    crumb: ["Install", "{OS}", "Node", "Install Node"],
    view: function(S){
      var body;
      if (S.os === "win") {
        body =
          "<p>Two ways — the installer is the simplest:</p>" +
          "<ul>" +
          "<li><b>Installer:</b> download the LTS version from <b>nodejs.org</b> and run it, accepting the defaults.</li>" +
          "<li><b>Or winget:</b> if you use the Windows package manager, run:</li>" +
          "</ul>" +
          CMD("winget install OpenJS.NodeJS.LTS", "Terminal");
      } else if (S.os === "mac") {
        body =
          "<p>Two ways — the installer is the simplest:</p>" +
          "<ul>" +
          "<li><b>Installer:</b> download the LTS version from <b>nodejs.org</b> and run it, accepting the defaults.</li>" +
          "<li><b>Or Homebrew:</b> if you already use Homebrew, run:</li>" +
          "</ul>" +
          CMD("brew install node@20", "Terminal");
      } else {
        body =
          "<p><b>macOS:</b> download the LTS installer from <b>nodejs.org</b>, or with Homebrew run " +
          "<code>brew install node@20</code>.</p>" +
          "<p><b>Windows:</b> download the LTS installer from <b>nodejs.org</b>, or run " +
          "<code>winget install OpenJS.NodeJS.LTS</code>.</p>";
      }
      body +=
        "<p>When it finishes, <b>close the terminal and open a fresh one</b> — an already-open " +
        "terminal won't see the new install. Then re-run the check.</p>";
      return {
        kicker: "Install · Node",
        title: "Install Node first",
        body: body,
        actions: [ { label: "Done — re-check Node", to: "nodeCheck", kind: "go" } ]
      };
    }
  },

  /* ---------- INSTALL: get the code ---------- */
  getCode: {
    crumb: ["Install", "{OS}", "Get the code"],
    view: function(){
      return {
        kicker: "Install · Code",
        title: "How will you get the code?",
        body: "<p>The project lives on GitHub as <code>noctivagous/ai-bot-app</code>. " +
              "Either way works — the rest of the wizard is identical.</p>",
        actions: [
          { label: "I use git", sub: "Clone it from the terminal", to: "getGit", kind: "choice" },
          { label: "No git", sub: "Download a ZIP from GitHub instead", to: "getZip", kind: "choice" }
        ]
      };
    }
  },

  getGit: {
    crumb: ["Install", "{OS}", "Get the code", "Git"],
    view: function(){
      return {
        kicker: "Install · Code",
        title: "Clone the repo",
        body: CMD("git clone https://github.com/noctivagous/ai-bot-app.git\ncd ai-bot-app", "Terminal") +
          "<p class='dim'>Run this wherever you keep projects. From here on, commands assume " +
          "you are inside the <code>ai-bot-app</code> folder unless a step says otherwise.</p>",
        ticks: [ ["clone", "Cloned, and the terminal is inside the ai-bot-app folder"] ],
        actions: [ { label: "Done — continue", to: "deps", kind: "go" } ]
      };
    }
  },

  getZip: {
    crumb: ["Install", "{OS}", "Get the code", "ZIP"],
    view: function(){
      return {
        kicker: "Install · Code",
        title: "Download and unzip",
        body:
          "<ol>" +
          "<li>Open the repo on GitHub: <code>github.com/noctivagous/ai-bot-app</code></li>" +
          "<li>Click <b>Code</b>, then <b>Download ZIP</b>.</li>" +
          "<li>Unzip it wherever you keep projects.</li>" +
          "</ol>" +
          "<p>The unzipped folder may be named <code>ai-bot-app-main</code> instead of " +
          "<code>ai-bot-app</code> — that's fine. Open a terminal inside it:</p>" +
          CMD("cd ai-bot-app", "Terminal") +
          "<p class='dim'>Adjust the folder name in that command if yours differs. From here on, " +
          "commands assume you are inside the repo folder unless a step says otherwise.</p>",
        ticks: [ ["zip", "Unzipped, and the terminal is inside the repo folder"] ],
        actions: [ { label: "Done — continue", to: "deps", kind: "go" } ]
      };
    }
  },

  /* ---------- INSTALL: dependencies ---------- */
  deps: {
    crumb: ["Install", "{OS}", "Dependencies"],
    view: function(){
      return {
        kicker: "Install · Dependencies",
        title: "Install dependencies",
        body:
          "<p>Two sets: the app's, then the bridge's. Run all four lines, in order:</p>" +
          CMD("npm install\ncd bridge\nnpm install\ncd ..", "Terminal — repo root") +
          "<p class='dim'>This can take a minute and prints a lot. What matters is that it " +
          "ends without a block of red errors. (If it does error, the Fix branch has a " +
          "Node-version check — the usual cause.)</p>",
        ticks: [ ["deps", "Both installs finished without errors"] ],
        actions: [ { label: "Done — continue", to: "bridgeStart", kind: "go" } ]
      };
    }
  },

  /* ---------- INSTALL: bridge ---------- */
  bridgeStart: {
    crumb: ["Install", "{OS}", "Bridge"],
    view: function(S){
      return {
        kicker: "Install · Bridge",
        title: "Start the bridge — and leave it running",
        body:
          "<p>This terminal becomes <b>Terminal 1</b>. The bridge occupies it for as long as " +
          "Mission Desk is in use, so it gets a terminal of its own.</p>" +
          CMD("cd ai-bot-app/bridge\nnpm start", "Terminal 1 — bridge") +
          "<p>Two things happen on this first run:</p>" +
          "<ul>" +
          "<li>The bridge starts listening on <b>127.0.0.1:7701</b> — this machine only.</li>" +
          "<li>It creates the <b>pairing token</b> at <code>bridge/.pairing.json</code> and prints that path (never the token itself). Full path on this system: <code>" + esc(pairPath(S.os)) + "</code></li>" +
          "</ul>" +
          "<div class='note'><p><b>The token never leaves this machine.</b> It exists only in " +
          "that file and, once you pair, in the extension's own storage. It is not in the repo " +
          "and is never shared or sent anywhere.</p></div>" +
          "<p class='dim'>Leave Terminal 1 open and running. Every later terminal is a new one.</p>",
        ticks: [ ["bridge", "Bridge is running in Terminal 1"] ],
        actions: [ { label: "Done — continue", to: "extLoad", kind: "go" } ]
      };
    }
  },

  /* ---------- INSTALL: extension ---------- */
  extLoad: {
    crumb: ["Install", "{OS}", "Extension"],
    view: function(S){
      return {
        kicker: "Install · Extension",
        title: "Load the extension into Chrome",
        body:
          "<ol>" +
          "<li>Open <code>chrome://extensions</code> in Chrome.</li>" +
          "<li>Turn on <b>Developer mode</b> — the switch at the top right of that page.</li>" +
          "<li>Click <b>Load unpacked</b>.</li>" +
          "<li>Select the repo's <code>extension</code> folder. On this system its path looks like <code>" + esc(extPath(S.os)) + "</code> — pick the folder itself, wherever you put the repo.</li>" +
          "</ol>" +
          "<p>The card “Mission Desk — Muse bridge” appears in the list, and its icon joins " +
          "Chrome's toolbar (behind the puzzle-piece menu — pin it from there so it's one click away).</p>",
        ticks: [ ["ext", "Extension loaded, and pinned to the toolbar"] ],
        actions: [ { label: "Done — continue", to: "pair", kind: "go" } ]
      };
    }
  },

  /* ---------- INSTALL: pairing ---------- */
  pair: {
    crumb: ["Install", "{OS}", "Pairing"],
    view: function(S){
      return {
        kicker: "Install · Pairing",
        title: "Pair the extension with the bridge",
        body:
          "<ol>" +
          "<li>Open <code>bridge/.pairing.json</code> in any text editor — on this system: <code>" + esc(pairPath(S.os)) + "</code>. It holds one value, named <code>\"token\"</code>. Copy that value.</li>" +
          "<li>Click the Mission Desk extension icon in Chrome's toolbar. The popup is titled <b>“Mission Desk — Muse bridge”</b>.</li>" +
          "<li>Paste the token into the field labelled <b>“Pairing token”</b>.</li>" +

  var host = document.getElementById("nodeHost");
  var crumbsEl = document.getElementById("crumbs");
  var backBtn = document.getElementById("backBtn");
  var scrollEl = document.getElementById("scroll");

  function render(){
    var def = NODES[S.node] || NODES.root;
    var v = def.view(S);
    document.body.setAttribute("data-node", S.node);
    document.body.setAttribute("data-os", S.os || "");

    // breadcrumb ({OS} dropped until an OS is chosen)
    var parts = def.crumb.map(function(p){ return p === "{OS}" ? osName(S.os) : p; })
                         .filter(function(p){ return p !== ""; });
    crumbsEl.innerHTML = parts.map(function(p, i){
      return (i ? '<span class="sep">›</span> ' : "") +
             '<span class="' + (i === parts.length - 1 ? "here" : "") + '">' + esc(p) + "</span>";
    }).join(" ");

    var html = '<div class="panel"><p class="nkicker">' + esc(v.kicker) + "</p>" +
               "<h2>" + esc(v.title) + "</h2>" + v.body + TICKS(v.ticks);
    var choices = (v.actions || []).filter(function(a){ return a.kind === "choice"; });
    var goes = (v.actions || []).filter(function(a){ return a.kind !== "choice"; });
    if (choices.length) {
      html += '<div class="choices">' + choices.map(function(a){
        return '<button type="button" class="choice" data-to="' + a.to + '"' +
               (a.os ? ' data-os="' + a.os + '"' : "") + ">" + esc(a.label) +
               (a.sub ? "<small>" + esc(a.sub) + "</small>" : "") + "</button>";
      }).join("") + "</div>";
    }
    if (goes.length) {
      html += '<div class="actions">' + goes.map(function(a){
        return '<button type="button" class="go' + (a.kind === "alt" ? " alt" : "") +
               '" data-to="' + a.to + '"' + (a.os ? ' data-os="' + a.os + '"' : "") + ">" +
               esc(a.label) + "</button>";
      }).join("") + "</div>";
    }
    html += "</div>";
    host.innerHTML = html;

    // restore tick states for this node
    host.querySelectorAll("[data-tick]").forEach(function(box){
      box.checked = !!S.ticks[box.getAttribute("data-tick")];
    });

    backBtn.disabled = S.stack.length === 0;
    scrollEl.scrollTop = 0;
    requestAnimationFrame(vLayout);
  }

  function go(id, os){
    if (!NODES[id]) return;
    S.stack.push(S.node);
    S.node = id;
    if (os) { S.os = os; persist(); }
    render();
  }

  host.addEventListener("click", function(e){
    var nav = e.target.closest ? e.target.closest("[data-to]") : null;
    if (nav) { go(nav.getAttribute("data-to"), nav.getAttribute("data-os")); return; }
    var btn = e.target.closest ? e.target.closest("[data-copy]") : null;
    if (!btn) return;
    var pre = btn.parentElement.querySelector("pre");
    var text = pre ? pre.textContent : "";
    function done(){
      btn.textContent = "copied"; btn.classList.add("ok");
      setTimeout(function(){ btn.textContent = "copy"; btn.classList.remove("ok"); }, 1400);
    }
    function fallback(){
      // Select-the-text fallback for file:// clipboard quirks.
      try {
        var range = document.createRange();
        range.selectNodeContents(pre);
        var sel = window.getSelection();
        sel.removeAllRanges(); sel.addRange(range);
        if (document.execCommand("copy")) { done(); return; }
      } catch (err) {}
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { if (document.execCommand("copy")) done(); } catch (err) {}
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else { fallback(); }
  });

  host.addEventListener("change", function(e){
    var box = e.target.closest ? e.target.closest("[data-tick]") : null;
    if (!box) return;
    S.ticks[box.getAttribute("data-tick")] = box.checked;
    persist();
  });

  backBtn.addEventListener("click", function(){
    if (!S.stack.length) return;
    S.node = S.stack.pop();
    render();
  });
  document.getElementById("startOverBtn").addEventListener("click", function(){
    S.node = "root"; S.stack = []; S.os = null; persist(); render();
  });

  /* ================= drawn scrollbar (as introduction.html) ================= */
  var vbar = document.getElementById("vbar");
  var vthumb = document.getElementById("vthumb");
  var wrapEl = document.querySelector(".wrap");
  function vMetrics(){
    var range = scrollEl.scrollHeight - scrollEl.clientHeight;
    return { range: range, over: range > 1 };
  }
  function vThumbTop(){
    var m = vMetrics(); if (!m.over) return 0;
    var trackH = vbar.clientHeight, thumbH = vthumb.offsetHeight;
    return (scrollEl.scrollTop / m.range) * (trackH - thumbH);
  }
  function vLayout(){
    var wr = wrapEl.getBoundingClientRect(), sr = scrollEl.getBoundingClientRect();
    vbar.style.top = (sr.top - wr.top) + "px";
    vbar.style.height = sr.height + "px";
    var m = vMetrics();
    if (!m.over) { vbar.classList.remove("show"); return; }
    vbar.classList.add("show");
    var thumbH = Math.max(28, scrollEl.clientHeight / scrollEl.scrollHeight * sr.height);
    vthumb.style.height = thumbH + "px";
    vthumb.style.transform = "translateY(" + vThumbTop() + "px)";
  }
  function vScrollSync(){
    if (!vbar.classList.contains("show")) { vLayout(); return; }
    vthumb.style.transform = "translateY(" + vThumbTop() + "px)";
  }
  scrollEl.addEventListener("scroll", vScrollSync, { passive: true });
  new MutationObserver(function(){ requestAnimationFrame(vLayout); })
    .observe(host, { childList: true, subtree: true });
  new ResizeObserver(function(){ vLayout(); }).observe(scrollEl);
  window.addEventListener("resize", vLayout);

  (function(){
    var drag = null;
    vthumb.addEventListener("pointerdown", function(e){
      drag = { y: e.clientY, top: scrollEl.scrollTop };
      vbar.classList.add("dragging");
      vthumb.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    vthumb.addEventListener("pointermove", function(e){
      if (!drag) return;
      var m = vMetrics(); if (!m.over) return;
      var trackRange = vbar.clientHeight - vthumb.offsetHeight;
      if (trackRange <= 0) return;
      scrollEl.scrollTop = drag.top + (e.clientY - drag.y) / trackRange * m.range;
    });
    function endDrag(){ drag = null; vbar.classList.remove("dragging"); }
    vthumb.addEventListener("pointerup", endDrag);
    vthumb.addEventListener("pointercancel", endDrag);
    vbar.addEventListener("pointerdown", function(e){
      if (e.target === vthumb) return;
      var m = vMetrics(); if (!m.over) return;
      var r = vbar.getBoundingClientRect();
      var ratio = (e.clientY - r.top - vthumb.offsetHeight / 2) / (r.height - vthumb.offsetHeight);
      ratio = Math.max(0, Math.min(1, ratio));
      scrollEl.scrollTop = ratio * m.range;
    });
    vbar.addEventListener("wheel", function(e){
      var m = vMetrics(); if (!m.over) return;
      e.preventDefault();
      scrollEl.scrollTop += e.deltaY;
    }, { passive: false });
  })();

  render();
})();
</script>
</body>
</html>
