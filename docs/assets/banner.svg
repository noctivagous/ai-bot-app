<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Mission Desk for Muse">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232529"/>
      <stop offset="1" stop-color="#17181b"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc95e"/>
      <stop offset="1" stop-color="#f0b23e"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="1198" height="278" rx="14" fill="url(#bg)" stroke="#2e3036" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="3" rx="1.5" fill="#3a3d44"/>
  <circle cx="72" cy="86" r="7" fill="#7fc96a"/>
  <text x="90" y="92" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" letter-spacing="4" fill="#f0b23e">AI-BOT-APP · MUSE AI MODE</text>
  <text x="70" y="152" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#e8e9ea">Mission Desk <tspan font-weight="400" fill="#a7abb3">for Muse</tspan></text>
  <text x="70" y="198" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#a7abb3">The desk for serious Muse work — every project, every running chat,</text>
  <text x="70" y="228" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#a7abb3">every approval, on one board.</text>
  <rect x="1030" y="196" width="100" height="30" rx="15" fill="url(#amber)"/>
  <text x="1080" y="217" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#171408">READY 11/11</text>
</svg>
